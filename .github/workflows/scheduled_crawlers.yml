name: aerodata-qcomm Scheduled Ingestion Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours automatically

jobs:
  scheduled-crawler:
    name: Execute Spatial Ingestion
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NOTIFICATION_PROVIDER: "telegram"
      PROXY_URL: ""
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CUSTOM_GATEWAY: ${{ secrets.TELEGRAM_CUSTOM_GATEWAY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: python -m playwright install chromium --with-deps

      - name: Run Orchestrator Pipeline
        run: python main.py

      - name: Execute Historical Archival
        run: python database/offload_historical.py

      - name: Report Pipeline Failure
        if: failure()
        run: |
          echo "::error::Scheduled quick-commerce ingestion pipeline failed!"


name: aerodata-qcomm Scheduled Ingestion Nightly

on:
  schedule:
    - cron: "30 18 * * *" # Runs at 18:30 UTC / 23:30 IST nightly
  workflow_dispatch:     # Allows manual forced execution via GitHub Actions UI

jobs:
  scheduled-crawler:
    name: Execute Spatial Ingestion
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NOTIFICATION_PROVIDER: "telegram"
      PROXY_URL: ""
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CUSTOM_GATEWAY: ${{ secrets.TELEGRAM_CUSTOM_GATEWAY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orchestrator Pipeline
        run: python main.py

      - name: Execute Historical Archival
        run: python database/offload_historical.py

name: aerodata-qcomm CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production

jobs:
  continuous-integration:
    name: Run Automated Quality Guardrails
    runs-on: ubuntu-latest

    services:
      # Spin up a temporary TimescaleDB instance to satisfy Z-score and verification tests
      timescaledb:
        image: timescale/timescaledb:latest-pg15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: gtquant
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: gtquant
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: 5432
      NOTIFICATION_PROVIDER: none
      PROXY_URL: ""

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Initialize Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Entity Resolver Validation
        run: python signals/entity_resolver.py

      - name: Execute Proxy Middleware Validation
        run: python scrapers/proxy_manager.py

      - name: Execute Statistical Guardrails Validation
        run: python signals/data_guardrails.py

  continuous-deployment:
    name: Execute Remote Server Orchestration
    needs: continuous-integration
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote deploy.sh via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /app/Projects/GT-Quant
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh
